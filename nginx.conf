server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # pdf.js loads its worker as an ES module, which browsers only accept
    # with a JavaScript MIME type.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
